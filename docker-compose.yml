services:
  postgres:
    image: postgres:16-alpine
    container_name: finder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finder_db}
      POSTGRES_USER: ${POSTGRES_USER:-finder_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finder_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finder_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finder_user} -d ${POSTGRES_DB:-finder_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finder_postgres_data:
