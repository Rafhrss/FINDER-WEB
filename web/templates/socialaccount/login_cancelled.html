{% extends "base.html" %}
{% block title %}Login Dibatalkan{% endblock %}
{% block content %}
<section class="mx-auto w-full max-w-xl">
    <div class="card border border-base-300 bg-base-200/70 shadow-sm">
        <div class="card-body gap-4 text-center">
            <h1 class="card-title text-2xl justify-center text-warning">Login Dibatalkan</h1>
            <p class="text-sm text-base-content/70">
                Proses login dengan Google telah dibatalkan. Silakan coba kembali jika Anda ingin masuk ke sistem.
            </p>
            <div class="card-actions justify-center mt-4">
                <a href="{% url 'web:login' %}" class="btn btn-primary w-full">Kembali ke Halaman Login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
