{% extends "base.html" %}
{% block title %}Daftar Akun{% endblock %}
{% block content %}
<section class="mx-auto w-full max-w-xl">
    <div class="card border border-base-300 bg-base-200/70 shadow-sm">
        <div class="card-body gap-4 text-center">
            <h1 class="card-title text-2xl justify-center">Daftar Akun</h1>
            <p class="text-sm text-base-content/70">
                Apakah Anda ingin mendaftarkan akun baru dengan email <strong>{{ sociallogin.user.email }}</strong>?
            </p>
            <form class="signup" id="signup_form" method="post" action="{% url 'socialaccount_signup' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary w-full">Lanjutkan Pendaftaran</button>
            </form>
            <div class="card-actions justify-center mt-2">
                <a href="{% url 'web:login' %}" class="btn btn-ghost btn-sm w-full">Batal</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
