<div class="card border border-base-300 bg-base-200/70 shadow-sm">
    <div class="card-body gap-3">
        <div class="flex items-start justify-between gap-4">
            <h3 class="card-title text-base">{{ report.title }}</h3>
            <span class="badge badge-outline">{{ report.get_status_display }}</span>
        </div>
        <p class="text-sm text-base-content/70">{{ report.description|truncatechars:140 }}</p>
        <div class="flex flex-wrap items-center gap-3 text-xs text-base-content/60">
            <span>Lokasi: {{ report.location }}</span>
            <span>Oleh: {{ report.user.name }}</span>
        </div>
        <div class="card-actions justify-end">
            <a class="btn btn-sm btn-primary" href="{% url 'web:report-detail' report.id %}">Lihat detail</a>
        </div>
    </div>
</div>
