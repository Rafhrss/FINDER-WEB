<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finder Kampus{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        nav a { margin-right: 12px; }
        .card { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 8px; }
        .muted { color: #666; font-size: 0.9rem; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'web:home' %}">Beranda</a>
        {% if request.user.is_authenticated %}
            <a href="{% url 'web:profile' %}">Profile</a>
            <form action="{% url 'web:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="next" value="{% url 'web:home' %}">
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'web:login' %}?next={{ request.path|urlencode }}">Login</a>
        {% endif %}
    </nav>
    <hr>
    {% if messages %}
        {% for message in messages %}
            <p class="{% if message.tags == 'error' %}error{% endif %}">{{ message }}</p>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
