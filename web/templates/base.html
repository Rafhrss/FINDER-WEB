{% load static %}
<!DOCTYPE html>
<html lang="id" data-theme="finder">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finder Kampus{% endblock %}</title>
    
    {% include "partials/_head_css.html" %}
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased font-sans">

        <main class="grow mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-8">

            {% block content %}{% endblock %}

        {% include "partials/_footer.html" %}

</html>
