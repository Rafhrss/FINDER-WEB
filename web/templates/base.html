{% load static %}
<!DOCTYPE html>
<html lang="id" data-theme="finder">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finder Kampus{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    
    {% include "partials/_head_css.html" %}
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased font-sans">
    <div class="flex min-h-screen flex-col {% block body_class %}{% endblock %}">
        {% include "partials/_navbar.html" %}
        <main class="grow {% block main_class %}mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-8{% endblock %}">
            {% include "partials/_messages.html" %}
            {% block content %}{% endblock %}
        </main>
        {% block footer %}{% include "partials/_footer.html" %}{% endblock %}
    </div>

    <!-- Vercel Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
