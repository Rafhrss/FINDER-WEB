{% load static %}
<!DOCTYPE html>
<html lang="id" data-theme="finder">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finder Kampus{% endblock %}</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased font-sans">
    <div class="flex min-h-screen flex-col">
        {% include "partials/_navbar.html" %}
        <main class="grow mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-8">
            {% include "partials/_messages.html" %}
            {% block content %}{% endblock %}
        </main>
        {% include "partials/_footer.html" %}
    </div>
</body>
</html>
