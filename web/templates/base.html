{% load static %}
<!DOCTYPE html>
<html lang="id" data-theme="finder">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finder Kampus{% endblock %}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased">
    <div class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(10,243,185,0.15),_transparent_45%)]">
        {% include "partials/_navbar.html" %}
        <main class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 py-8">
            {% include "partials/_messages.html" %}
            {% block content %}{% endblock %}
        </main>
        {% include "partials/_footer.html" %}
    </div>
</body>
</html>
