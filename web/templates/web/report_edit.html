{% extends "base.html" %}
{% block title %}Edit Laporan{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Form Container -->
    <div class="card bg-base-200/40 shadow-xl border border-base-300 rounded-3xl p-6 md:p-10">
        
        <form method="POST" enctype="multipart/form-data" action="{% url 'web:report-edit' report.id %}" class="flex flex-col gap-8">
            {% csrf_token %}
            
            <!-- Header Section: Title & Status -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 pb-6 border-b border-base-300/50">
                <h1 class="text-3xl font-bold text-primary">Edit Laporan</h1>
                
                <!-- Status Toggle (Radio Buttons) -->
                <div class="flex flex-wrap gap-4">
                    <label class="cursor-pointer relative">
                        <input type="radio" name="status" value="LOST" class="peer sr-only" required {% if report.status == 'LOST' %}checked{% endif %}>
                        <div class="px-6 py-2.5 rounded-xl border border-base-content/20 text-base-content/60 peer-checked:border-error peer-checked:text-error peer-checked:bg-error/5 transition-all font-semibold text-sm">
                            Barang Hilang
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="status" value="FOUND" class="peer sr-only" required {% if report.status == 'FOUND' %}checked{% endif %}>
                        <div class="px-6 py-2.5 rounded-xl border border-base-content/20 text-base-content/60 peer-checked:border-warning peer-checked:text-warning peer-checked:bg-warning/5 transition-all font-semibold text-sm">
                            Menemukan
                        </div>
                    </label>
                    <label class="cursor-pointer relative">
                        <input type="radio" name="status" value="CLAIMED" class="peer sr-only" required {% if report.status == 'CLAIMED' %}checked{% endif %}>
                        <div class="px-6 py-2.5 rounded-xl border border-base-content/20 text-base-content/60 peer-checked:border-success peer-checked:text-success peer-checked:bg-success/5 transition-all font-semibold text-sm">
                            Selesai (Claimed)
                        </div>
                    </label>
                </div>
            </div>

            <!-- Two Column Grid for Form Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
                
                <!-- Left Column -->
                <div class="flex flex-col gap-8">
                    
                    <!-- Nama Barang -->
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-2">
                            <span class="label-text text-xs font-bold tracking-widest uppercase text-base-content/70">Nama Barang</span>
                        </label>
                        <input type="text" name="title" placeholder="Contoh: Dompet Kulit Coklat" class="input input-bordered bg-base-200/50 focus:bg-base-200 w-full rounded-xl transition-all" required value="{{ report.title }}">
                    </div>

                    <!-- Lokasi Utama -->
                    <div class="form-control w-full">
                        <label class="label pt-0 pb-2">
                            <span class="label-text text-xs font-bold tracking-widest uppercase text-base-content/70">Lokasi Terakhir / Ditemukan</span>
                        </label>
                        <select name="location" class="select select-bordered bg-base-200 focus:bg-base-200 w-full rounded-xl transition-all font-normal" required>
                            <option value="" disabled>Pilih Gedung / Area...</option>
                            <optgroup label="Gedung">
                                <option value="Gedung A" {% if report.location == 'Gedung A' %}selected{% endif %}>Gedung A</option>
                                <option value="Gedung B" {% if report.location == 'Gedung B' %}selected{% endif %}>Gedung B</option>
                                <option value="Gedung C" {% if report.location == 'Gedung C' %}selected{% endif %}>Gedung C</option>
                                <option value="Gedung D" {% if report.location == 'Gedung D' %}selected{% endif %}>Gedung D</option>
                                <option value="Gedung E" {% if report.location == 'Gedung E' %}selected{% endif %}>Gedung E</option>
                                <option value="Gedung F" {% if report.location == 'Gedung F' %}selected{% endif %}>Gedung F</option>
                                <option value="Gedung G" {% if report.location == 'Gedung G' %}selected{% endif %}>Gedung G</option>
                            </optgroup>
                            <optgroup label="Parkiran">
                                <option value="Parkiran A" {% if report.location == 'Parkiran A' %}selected{% endif %}>Parkiran A</option>
                                <option value="Parkiran D" {% if report.location == 'Parkiran D' %}selected{% endif %}>Parkiran D</option>
                                <option value="Parkiran E" {% if report.location == 'Parkiran E' %}selected{% endif %}>Parkiran E</option>
                                <option value="Parkiran F" {% if report.location == 'Parkiran F' %}selected{% endif %}>Parkiran F</option>
                                <option value="Parkiran G" {% if report.location == 'Parkiran G' %}selected{% endif %}>Parkiran G</option>
                                <option value="Parkiran Lapangan" {% if report.location == 'Parkiran Lapangan' %}selected{% endif %}>Parkiran Lapangan</option>
                            </optgroup>
                            <optgroup label="Fasilitas Umum">
                                <option value="Kantin Utama" {% if report.location == 'Kantin Utama' %}selected{% endif %}>Kantin Utama</option>
                                <option value="Perpustakaan" {% if report.location == 'Perpustakaan' %}selected{% endif %}>Perpustakaan</option>
                                <option value="Mushola Kampus" {% if report.location == 'Mushola Kampus' %}selected{% endif %}>Mushola Kampus</option>
                            </optgroup>
                            <optgroup label="Laboratorium">
                                <option value="Lab Software" {% if report.location == 'Lab Software' %}selected{% endif %}>Lab Software</option>
                                <option value="Lab Hardware" {% if report.location == 'Lab Hardware' %}selected{% endif %}>Lab Hardware</option>
                                <option value="Lab Komputer Gedung E" {% if report.location == 'Lab Komputer Gedung E' %}selected{% endif %}>Lab Komputer Gedung E</option>
                            </optgroup>
                            <option value="Lainnya" {% if report.location == 'Lainnya' %}selected{% endif %}>Lainnya</option>
                        </select>
                    </div>

                </div>

                <!-- Right Column -->
                <div class="flex flex-col gap-8">
                    
                    <!-- Deskripsi -->
                    <div class="form-control w-full h-full">
                        <label class="label pt-0 pb-2">
                            <span class="label-text text-xs font-bold tracking-widest uppercase text-base-content/70">Deskripsi / Ciri-ciri Khusus</span>
                        </label>
                        <textarea name="description" class="textarea textarea-bordered bg-base-200/50 focus:bg-base-200 w-full rounded-xl transition-all grow resize-none min-h-64 leading-relaxed" placeholder="Warna :&#10;Jumlah :&#10;Merk :&#10;Ukuran :" required>{{ report.description }}</textarea>
                    </div>

                </div>

                <!-- Full Width: Upload Foto -->
                <div class="form-control w-full md:col-span-2 mt-2">
                    <label class="label pt-0 pb-2">
                        <span class="label-text text-xs font-bold tracking-widest uppercase text-base-content/70">Ubah Foto (Opsional)</span>
                    </label>
                    <label id="uploadBox" class="flex flex-col items-center justify-center w-full h-36 border-2 border-primary/50 border-dashed rounded-2xl cursor-pointer bg-base-200/20 hover:bg-base-200/50 transition-colors group {% if report.image %}hidden{% endif %}">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mb-3 group-hover:scale-110 transition-transform">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                            </svg>
                            <p class="font-bold text-base-content/80 text-sm">Ganti Foto Barang</p>
                        </div>
                        <input type="file" name="image" accept="image/*" class="hidden" id="imageInput" onchange="previewImage(event)"/>
                    </label>
                    <div id="imagePreviewContainer" class="mt-4 {% if not report.image %}hidden{% endif %} relative w-32 h-32 rounded-xl overflow-hidden border border-base-300">
                        <img id="imagePreview" src="{% if report.image %}{{ report.image }}{% endif %}" alt="Preview" class="w-full h-full object-cover">
                        <button type="button" onclick="triggerFileInput()" class="absolute inset-0 w-full h-full bg-black/40 text-white flex flex-col items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                            <span class="text-xs font-bold">Ganti Foto</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Footer: Submit Button -->
            <div class="flex justify-end items-center gap-4 pt-4 mt-2 border-t border-base-300/50">
                <a href="{% url 'web:report-detail' report.id %}" class="btn btn-outline btn-error px-8 rounded-xl font-bold hover:-translate-y-0.5 transition-transform">Batal</a>
                <button type="submit" class="btn btn-primary px-10 rounded-xl font-bold text-base shadow-lg hover:-translate-y-0.5 transition-transform">
                    Simpan Perubahan
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    function showToast(message) {
        let toastContainer = document.getElementById('daisy-toast-container');
        if (!toastContainer) {
            toastContainer = document.createElement('div');
            toastContainer.id = 'daisy-toast-container';
            toastContainer.className = 'toast toast-bottom toast-end z-50 mt-16';
            document.body.appendChild(toastContainer);
        }

        const alertEl = document.createElement('div');
        alertEl.className = 'alert alert-error shadow-lg text-white animate-bounce';
        
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
        
        alertEl.innerHTML = `
            ${iconSvg}
            <span class="font-semibold">${message}</span>
        `;
        
        toastContainer.appendChild(alertEl);

        setTimeout(() => {
            alertEl.classList.replace('animate-bounce', 'opacity-0');
            alertEl.classList.add('transition-opacity', 'duration-500');
            setTimeout(() => {
                alertEl.remove();
                if (toastContainer.children.length === 0) {
                    toastContainer.remove();
                }
            }, 500);
        }, 3500);
    }

    function triggerFileInput() {
        document.getElementById('imageInput').click();
    }

    function previewImage(event) {
        const input = event.target;
        const previewContainer = document.getElementById('imagePreviewContainer');
        const previewImage = document.getElementById('imagePreview');
        const uploadBox = document.getElementById('uploadBox');
        
        if (input.files && input.files[0]) {
            const file = input.files[0];
            
            if (file.size > 5 * 1024 * 1024) {
                showToast("Ukuran file terlalu besar! Maksimal 5MB.");
                input.value = '';
                return;
            }
            
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
            if (!validTypes.includes(file.type)) {
                showToast("Format tidak didukung! Harap unggah gambar JPG atau PNG.");
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                previewContainer.classList.remove('hidden');
                uploadBox.classList.add('hidden');
            }
            reader.readAsDataURL(file);
        }
    }
</script>
{% endblock %}
